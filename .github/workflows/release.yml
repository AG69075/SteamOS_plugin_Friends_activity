name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package plugin zip
        run: |
          mkdir -p /tmp/pkg/friends-activity-bubble
          cp -r dist main.py plugin.json package.json README.md /tmp/pkg/friends-activity-bubble/
          cd /tmp/pkg
          zip -r friends-activity-bubble.zip friends-activity-bubble
          mv friends-activity-bubble.zip "$GITHUB_WORKSPACE/friends-activity-bubble.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: friends-activity-bubble.zip